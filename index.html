<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mon Stock</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body{font-family:sans-serif;margin:0;padding:15px;background:#f2f2f2}
  h1{text-align:center;margin:5px 0 15px}
  h3{margin:15px 0 5px;color:#007aff}
  button{font-size:20px;padding:15px;border:none;border-radius:10px;width:100%;margin:5px 0;color:#fff}
  .scan{background:#007aff}.plus{background:#34c759}.moins{background:#ff3b30}.gris{background:#888}
  input,select{font-size:20px;padding:12px;width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #ccc;margin:5px 0;background:#fff}
  #carte{background:#fff;padding:15px;border-radius:10px;margin:10px 0;display:none}
  .art{background:#fff;padding:12px;border-radius:10px;margin:6px 0;display:flex;justify-content:space-between;font-size:18px;
       -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .art.appui{background:#ffd6d6}
  .qte{font-weight:bold}
  #msg{text-align:center;font-size:18px;min-height:24px}
  .aide{text-align:center;color:#888;font-size:14px}
</style>
</head>
<body>
<h1>📦 Mon Stock</h1>
<button class="scan" onclick="lancerScan()">📷 Scanner un article</button>
<div id="lecteur"></div>
<input id="codeManuel" placeholder="ou tape le code ici">
<button class="gris" onclick="choisir(document.getElementById('codeManuel').value.trim())">Valider le code</button>

<div id="carte">
  <div id="nomArt" style="font-size:22px;font-weight:bold"></div>
  <div id="infoArt"></div>
  <select id="cat"></select>
  <input id="qte" type="number" value="1" min="1">
  <button class="plus" onclick="modif(1)">➕ Ajouter</button>
  <button class="moins" onclick="modif(-1)">➖ Retirer</button>
</div>
<div id="msg"></div>
<h2>Articles</h2>
<select id="filtre" onchange="afficher()"></select>
<button class="gris" onclick="charger()">🔄 Actualiser</button>
<p class="aide">Appui long sur un article pour le supprimer</p>
<div id="liste"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbzoRfEK-UvxKi5FLESjQeIs34DK_GJstWXObkU-oNg7HIYzmRhLhjnn18Sz99i3NCqC/exec";
const CATS=["Câble","Chargeur","Dock","Dock + câble","Écouteurs","Batterie externe","Hydrogel","Écran in-cell","Écran soft LED"];
let stock=[],actuel=null,scanner=null;

document.getElementById("cat").innerHTML='<option value="">-- Catégorie --</option>'+CATS.map(c=>`<option>${c}</option>`).join("");
document.getElementById("filtre").innerHTML='<option value="">Toutes les catégories</option>'+CATS.map(c=>`<option>${c}</option>`).join("");

function catDe(a){return CATS.includes(a.cat)?a.cat:"";}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}

function afficher(){
  const f=document.getElementById("filtre").value;
  let h="";
  [...CATS,""].forEach(c=>{
    if(f && f!==c)return;
    const arts=stock.filter(a=>catDe(a)===c);
    if(!arts.length)return;
    h+=`<h3>${c||"Sans catégorie"}</h3>`+arts.map(a=>
      `<div class="art" data-code="${esc(a.code)}"><span>${esc(a.nom||a.code)}</span><span class="qte">${a.qte}</span></div>`).join("");
  });
  const liste=document.getElementById("liste");
  liste.innerHTML=h||"<p>Aucun article</p>";
  liste.querySelectorAll(".art").forEach(brancher);
}

function brancher(el){
  let minuteur=null,long=false;
  const code=el.dataset.code;
  const debut=()=>{
    long=false;el.classList.add("appui");
    minuteur=setTimeout(()=>{long=true;el.classList.remove("appui");supprimer(code);},700);
  };
  const fin=()=>{clearTimeout(minuteur);el.classList.remove("appui");};
  el.addEventListener("touchstart",debut,{passive:true});
  el.addEventListener("touchend",fin);
  el.addEventListener("touchmove",fin,{passive:true});
  el.addEventListener("mousedown",debut);
  el.addEventListener("mouseup",fin);
  el.addEventListener("mouseleave",fin);
  el.addEventListener("contextmenu",e=>e.preventDefault());
  el.addEventListener("click",()=>{if(!long)choisir(code);});
}

async function supprimer(code){
  const a=stock.find(x=>x.code==code);
  if(!a)return;
  if(!confirm("Supprimer « "+(a.nom||a.code)+" » ?"))return;
  msg("Suppression...");
  try{
    await appel({action:"suppr",code:code});
    msg("🗑️ Article supprimé");
    if(actuel&&actuel.code==code){document.getElementById("carte").style.display="none";actuel=null;}
  }catch(e){msg("Erreur, réessaie");}
}

async function appel(params){
  const r=await fetch(API+"?"+new URLSearchParams(params));
  stock=await r.json();afficher();
}
async function charger(){
  msg("Chargement...");
  try{await appel({});msg("");}catch(e){msg("Erreur de connexion");}
}
function msg(t){document.getElementById("msg").textContent=t;}

function lancerScan(){
  if(scanner){return;}
  scanner=new Html5Qrcode("lecteur");
  scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:250,height:150}},
    code=>{scanner.stop().then(()=>{scanner.clear();scanner=null;});choisir(code);},()=>{})
  .catch(()=>{msg("Caméra impossible");scanner=null;});
}
function choisir(code){
  if(!code)return;
  let a=stock.find(x=>x.code==code);
  if(!a){
    const nom=prompt("Nouvel article ! Quel est son nom ?");
    if(nom===null)return;
    a={code:code,nom:nom,qte:0,cat:""};
  }
  actuel=a;
  document.getElementById("nomArt").textContent=a.nom||a.code;
  document.getElementById("infoArt").textContent="Stock actuel : "+a.qte+"  (code "+a.code+")";
  document.getElementById("cat").value=catDe(a);
  document.getElementById("qte").value=1;
  document.getElementById("carte").style.display="block";
  window.scrollTo(0,0);
}
async function modif(sens){
  if(!actuel)return;
  const n=parseInt(document.getElementById("qte").value)||0;
  if(n<=0)return;
  msg("Enregistrement...");
  try{
    await appel({action:"modif",code:actuel.code,nom:actuel.nom,delta:sens*n,cat:document.getElementById("cat").value});
    const a=stock.find(x=>x.code==actuel.code);
    msg((sens>0?"✅ Ajouté ":"✅ Retiré ")+n+" — stock : "+(a?a.qte:0));
    document.getElementById("carte").style.display="none";actuel=null;
  }catch(e){msg("Erreur, réessaie");}
}
charger();
</script>
</body>
